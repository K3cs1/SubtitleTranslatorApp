spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  application:
    name: SubtitleTranslatorApp

server:
  port: ${PORT:5000}
  address: 0.0.0.0
  tomcat:
    max-http-form-post-size: 3MB
    max-swallow-size: 3MB
deepl:
  base-url: ${DEEPL_BASE_URL:https://api-free.deepl.com}
  auth-key: ${DEEPL_API_KEY:DEEPL_API_KEY}
translation:
  # Upper bound on number of subtitle entries per DeepL request (actual batch may be smaller due to max-batch-chars).
  batch-size: 50
  # Safety cap to avoid oversized DeepL payloads; tune up/down based on subtitle density.
  max-batch-chars: 12000
  max-parallel: 5
logging:
  level:
    root: warn
