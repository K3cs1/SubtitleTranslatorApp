name: Configure EB DeepL env

on:
  workflow_dispatch:

concurrency:
  group: configure-eb-deepl
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set DeepL environment properties on Elastic Beanstalk
        env:
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          DEEPL_BASE_URL: ${{ secrets.DEEPL_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPL_API_KEY:-}" ]; then
            echo "DEEPL_API_KEY secret is empty" >&2
            exit 1
          fi
          BASE_URL="${DEEPL_BASE_URL:-https://api-free.deepl.com}"

          # Fetch current option settings and replace OpenAI with DeepL keys.
          aws elasticbeanstalk describe-configuration-settings \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --environment-name "${EB_ENV_NAME}" \
            --query 'ConfigurationSettings[0].OptionSettings[?Namespace==`aws:elasticbeanstalk:application:environment`].[OptionName,Value]' \
            --output text | tee /tmp/current-env.txt || true

          aws elasticbeanstalk update-environment \
            --environment-name "${EB_ENV_NAME}" \
            --option-settings \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DEEPL_API_KEY,Value=${DEEPL_API_KEY}" \
              "Namespace=aws:elasticbeanstalk:application:environment,OptionName=DEEPL_BASE_URL,Value=${BASE_URL}"

          echo "Waiting for environment to become Ready..."
          aws elasticbeanstalk wait environment-updated --environment-names "${EB_ENV_NAME}" || true
          aws elasticbeanstalk describe-environments \
            --environment-names "${EB_ENV_NAME}" \
            --query 'Environments[0].{Status:Status,Health:Health,CNAME:CNAME,EndpointURL:EndpointURL}' \
            --output json

      - name: Remove obsolete OPENAI_API_KEY if present
        env:
          EB_ENV_NAME: ${{ secrets.EB_ENV_NAME }}
        run: |
          set -euo pipefail
          if aws elasticbeanstalk describe-configuration-settings \
            --application-name "${{ secrets.EB_APP_NAME }}" \
            --environment-name "${EB_ENV_NAME}" \
            --query 'ConfigurationSettings[0].OptionSettings[?Namespace==`aws:elasticbeanstalk:application:environment` && OptionName==`OPENAI_API_KEY`].OptionName' \
            --output text | grep -q OPENAI_API_KEY; then
            aws elasticbeanstalk update-environment \
              --environment-name "${EB_ENV_NAME}" \
              --options-to-remove \
                "Namespace=aws:elasticbeanstalk:application:environment,OptionName=OPENAI_API_KEY"
            aws elasticbeanstalk wait environment-updated --environment-names "${EB_ENV_NAME}" || true
            echo "Removed OPENAI_API_KEY"
          else
            echo "OPENAI_API_KEY not present; nothing to remove"
          fi
